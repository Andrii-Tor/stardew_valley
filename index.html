<html lang="ru">

<meta charset="UTF-8">

<title>Stardew Valley — Клуб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --wood-dark: #45200d;
    --wood-mid: #7c3f1c;
    --wood-light: #c47d3e;
    --parchment: #f9eab8;
    --card-bg: #fff6d6;
    --gold: #ffcc00;
    --green: #22c55e;
  }
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    background: #12161f;
    color: #3b1704;
    font-family: 'Rubik', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }

  .club-map-wrapper {
    position: relative;
    width: 100%;
    max-width: 1150px;
    aspect-ratio: 1000 / 426;
    background: #000;
    border: 6px solid var(--wood-dark);
    border-radius: 12px;
    box-shadow: 0 0 0 3px var(--wood-light), 0 16px 40px rgba(0,0,0,0.85);
    overflow: hidden;
  }

  .club-base-img {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }

  .room-overlay {
    position: absolute;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  .room-overlay img {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  .room-overlay.restored { opacity: 0; }

  #ov-crafts   { left: 10.1%; top: 47.65%; width: 20.0%; height: 52.35%; }
  #ov-pantry   { left: 16.5%; top: 0.0%;   width: 13.3%; height: 36.4%; }
  #ov-fishtank { left: 52.7%; top: 13.6%;  width: 13.8%; height: 30.3%; }
  #ov-vault    { left: 66.9%; top: 0.0%;   width: 22.9%; height: 30.8%; }
  #ov-boiler   { left: 76.9%; top: 31.9%;  width: 23.1%; height: 40.1%; }
  #ov-bulletin { left: 65.0%; top: 32.9%;  width: 8.8%;  height: 11.0%; }

  #ov-joja     { left: 65.6%; top: 53.5%;  width: 13.8%; height: 32.8%; }

  .box-hotspot {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 1.6%;
    height: 3.6%;
    border: 2px solid var(--gold);
    border-radius: 3px;
    background: rgba(255, 204, 0, 0.2);
    box-shadow: 0 0 8px var(--gold);
    cursor: pointer;
    z-index: 10;
    animation: pulseBox 1.8s infinite;
  }
  .box-hotspot:hover {
    background: rgba(255, 204, 0, 0.55);
    transform: translate(-50%, -50%) scale(1.18);
  }
  .box-hotspot.bulletin-hotspot { width: 6.5%; height: 8.5%; }
  .box-hotspot.completed-box {
    border-color: var(--green);
    background: rgba(34, 197, 94, 0.35);
    box-shadow: 0 0 10px var(--green);
    animation: none;
  }
  @keyframes pulseBox {
    0%, 100% { box-shadow: 0 0 6px var(--gold); }
    50%      { box-shadow: 0 0 16px #fff, 0 0 22px var(--gold); }
  }

  /* Модальне вікно */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.76);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }

  .modal-window {
    width: 100%;
    max-width: 840px;
    max-height: 88vh;
    background: var(--parchment);
    border: 6px solid var(--wood-dark);
    border-radius: 10px;
    box-shadow: 0 0 0 4px var(--wood-light), 0 20px 50px rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    background: var(--wood-mid);
    color: #fff5d6;
    padding: 12px 18px;
    border-bottom: 4px solid var(--wood-light);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .modal-header-left {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  .modal-header h2 {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: 0.3px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.45);
  }
  .room-reward-badge {
    background: rgba(0,0,0,0.28);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--wood-light);
    font-size: 0.88rem;
    font-weight: 600;
    color: #fde68a;
  }
  .room-reward-badge a {
    color: #fff;
    text-decoration: underline;
    font-weight: 700;
  }
  .close-btn {
    background: #b91c1c;
    color: #fff;
    border: 2px solid #ffd8d8;
    border-radius: 6px;
    width: 32px;
    height: 32px;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .modal-body {
    padding: 14px;
    overflow-y: auto;
  }

  .bundle-section {
    background: var(--card-bg);
    border: 3px solid var(--wood-light);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .bundle-header-row {
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px dashed #d6b88a;
    padding-bottom: 8px;
    margin-bottom: 10px;
  }
  .bundle-icon-ui {
    width: 30px;
    height: 30px;
    object-fit: contain;
    image-rendering: pixelated;
  }
  .bundle-title {
    font-weight: 800;
    font-size: 1.05rem;
    flex: 1;
    color: var(--wood-dark);
  }
  .bundle-progress-badge {
    font-weight: 800;
    font-size: 0.92rem;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(0,0,0,0.06);
  }

  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
    gap: 8px;
  }

  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 9px;
    border: 2px solid #d4b483;
    border-radius: 8px;
    background: #fbf0c9;
    transition: all 0.15s;
  }
  .item-row.checked {
    border-color: var(--green);
    background: #dcfce7;
  }
  .item-icon-btn {
    position: relative;
    width: 44px;
    height: 44px;
    border: 2px solid var(--wood-mid);
    border-radius: 6px;
    background: #fffdf7;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .item-icon-btn:hover {
    border-color: var(--wood-dark);
    transform: scale(1.05);
  }
  .item-icon-btn img.main-sprite {
    width: 32px;
    height: 32px;
    object-fit: contain;
    image-rendering: pixelated;
  }
  .quality-star {
    position: absolute;
    bottom: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    image-rendering: pixelated;
    pointer-events: none;
  }
  .check-badge {
    position: absolute;
    bottom: -4px;
    right: -4px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #b8a68e;
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
    opacity: 0.4;
    transition: all 0.15s;
  }
  .item-row.checked .check-badge {
    background: var(--green);
    opacity: 1;
    box-shadow: 0 0 5px var(--green);
  }

  .item-details { flex: 1; min-width: 0; }
  .item-link {
    font-weight: 700;
    font-size: 0.92rem;
    color: #6b2106;
    text-decoration: none;
    display: block;
    line-height: 1.2;
    margin-bottom: 2px;
  }
  .item-link:hover { text-decoration: underline; color: #b45309; }
  .item-where {
    font-size: 0.78rem;
    font-weight: 500;
    color: #5c4028;
    line-height: 1.25;
  }

  .bundle-reward-footer {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed #d6b88a;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    color: #45200d;
  }
  .reward-icon-sm {
    width: 26px;
    height: 26px;
    object-fit: contain;
    image-rendering: pixelated;
  }
  .reward-link {
    color: #9a3412;
    font-weight: 700;
    text-decoration: none;
  }
  .reward-link:hover { text-decoration: underline; }
</style>
</head>

let checkedItems = JSON.parse(localStorage.getItem("sv_checked_v3") || "{}");
let activeRoomKey = null;

function isRoomComplete(roomKey) {
  return ROOMS[roomKey].bundles.every(b => {
    const done = b.items.filter(it => checkedItems[it.id]).length;
    return done >= b.req;
  });
}

function updateMapOverlays() {
  Object.keys(ROOMS).forEach(rKey => {
    const complete = isRoomComplete(rKey);
    const ov = document.getElementById("ov-" + rKey);
    const box = document.getElementById("box-" + rKey);
    if (ov) ov.classList.toggle("restored", complete);
    if (box) box.classList.toggle("completed-box", complete);
  });
}

function toggleItem(itemId) {
  checkedItems[itemId] = !checkedItems[itemId];
  localStorage.setItem("sv_checked_v3", JSON.stringify(checkedItems));
  renderModalContent();
  updateMapOverlays();
}

function openRoomModal(roomKey) {
  activeRoomKey = roomKey;
  renderModalContent();
  document.getElementById("roomModal").classList.add("open");
}

function closeRoomModal() {
  document.getElementById("roomModal").classList.remove("open");
}

function renderModalContent() {
  if (!activeRoomKey) return;
  const room = ROOMS[activeRoomKey];
  document.getElementById("modalTitle").textContent = room.title;
  document.getElementById("modalRoomReward").innerHTML = `Награда за комнату: <a href="${WIKI_BASE}${room.roomRewardWiki}" target="_blank">${room.roomRewardName}</a>`;

  let html = "";

  room.bundles.forEach(b => {
    const doneCount = b.items.filter(it => checkedItems[it.id]).length;
    const isDone = doneCount >= b.req;

    html += `<div class="bundle-section">
      <div class="bundle-header-row">
        <img src="img/ui/${b.uiIcon}" class="bundle-icon-ui">
        <span class="bundle-title">${b.name}</span>
        <span class="bundle-progress-badge" style="color:${isDone ? '#15803d' : '#7c2d12'}">
          ${Math.min(doneCount, b.req)} / ${b.req} ${isDone ? '✓' : ''}
        </span>
      </div>
      <div class="items-grid">`;

    b.items.forEach(it => {
      const isChecked = !!checkedItems[it.id];
      const baseName = it.file || it.name.replace(/\s*\(\d+\)/g, '').trim();
      const wikiSlug = it.wiki || baseName.replace(/\s+/g, '_');
      const primaryImg = it.customImg || `img/${room.folder}/${baseName}.${room.ext}`;
      const altExt = room.ext === "png" ? "webp" : "png";
      const fallbackImg = it.customImg || `img/${room.folder}/${baseName}.${altExt}`;

      let starHtml = "";
      if (it.quality === "gold") {
        starHtml = `<img src="img/Кладовая/звезда.png" class="quality-star">`;
      } else if (it.quality === "silver") {
        starHtml = `<img src="img/Заброшенный ДжоджаМарт/звезда с.png" class="quality-star">`;
      }

      html += `
        <div class="item-row ${isChecked ? 'checked' : ''}">
          <div class="item-icon-btn" onclick="toggleItem('${it.id}')" title="Отметить предмет">
            <img src="${primaryImg}" class="main-sprite" onerror="this.onerror=null; this.src='${fallbackImg}';">
            ${starHtml}
            <span class="check-badge">✓</span>
          </div>
          <div class="item-details">
            <a href="${WIKI_BASE}${wikiSlug}" target="_blank" class="item-link">${it.name}</a>
            <div class="item-where">${it.where}</div>
          </div>
        </div>
      `;
    });

    html += `</div>`;

    if (b.rewardName && b.rewardFile) {
      const rewImg1 = `img/${room.folder}/${b.rewardFile}.${room.ext}`;
      const altExt = room.ext === "png" ? "webp" : "png";
      const rewImg2 = `img/${room.folder}/${b.rewardFile}.${altExt}`;
      html += `
        <div class="bundle-reward-footer">
          <img src="img/ui/Награда.webp" class="reward-icon-sm">
          <span>Награда:</span>
          <img src="${rewImg1}" class="reward-icon-sm" onerror="this.onerror=null; this.src='${rewImg2}';">
          <a href="${WIKI_BASE}${b.rewardWiki}" target="_blank" class="reward-link">${b.rewardName}</a>
        </div>
      `;
    }

    html += `</div>`;
  });

  document.getElementById("modalBody").innerHTML = html;
}

updateMapOverlays();
